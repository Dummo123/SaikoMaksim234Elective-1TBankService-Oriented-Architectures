name: Warehouse CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Create test results
        run: mkdir -p HW7/test-results
      - name: Install consumer deps
        run: pip install -r HW7/consumer_service/requirements.txt -r HW7/consumer_service/tests/requirements.txt
      - name: Run consumer unit tests
        run: cd HW7/consumer_service && python -m pytest tests/test_unit_handlers.py -v --tb=short --junitxml=../test-results/consumer-unit.xml
      - name: Install WMS deps
        run: pip install -r HW7/wms_service/requirements.txt -r HW7/wms_service/tests/requirements.txt
      - name: Run WMS unit tests
        run: cd HW7/wms_service && python -m pytest tests/test_unit_wms.py -v --tb=short --junitxml=../test-results/wms-unit.xml
      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: HW7/test-results/

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build wms-service
        run: docker build -t warehouse/wms-service:ci HW7/wms_service
      - name: Build consumer-service
        run: docker build -t warehouse/consumer-service:ci HW7/consumer_service
      - name: Build cassandra-exporter
        run: docker build -t warehouse/cassandra-exporter:ci HW7/cassandra_exporter

  integration-e2e:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Create test results
        run: mkdir -p HW7/test-results
      - name: Start services
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml up -d --build
      - name: Wait for services
        env:
          MAX_WAIT: "300"
        run: bash HW7/scripts/wait_for_services.sh
      - name: Install integration deps
        run: pip install -r HW7/tests/integration/requirements.txt
      - name: Run integration tests
        env:
          WMS_URL: http://localhost:8000
          CONSUMER_URL: http://localhost:8001
          CASSANDRA_HOSTS: localhost
          PROCESS_WAIT: "5"
        run: python -m pytest HW7/tests/integration/test_integration.py -v --tb=short --junitxml=HW7/test-results/integration.xml
      - name: Install E2E deps
        run: pip install -r HW7/tests/e2e/requirements.txt
      - name: Run E2E tests
        env:
          WMS_URL: http://localhost:8000
          CONSUMER_URL: http://localhost:8001
          CASSANDRA_HOSTS: localhost
          PROCESS_WAIT: "5"
        run: python -m pytest HW7/tests/e2e/test_e2e.py -v --tb=short --junitxml=HW7/test-results/e2e.xml
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml logs --no-color > HW7/service-logs.txt 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-results
          path: |
            HW7/test-results/
            HW7/service-logs.txt
      - name: Tear down
        if: always()
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml down -v

  load-and-metrics:
    name: Load Tests & Metrics Validation
    runs-on: ubuntu-latest
    needs: integration-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml up -d --build
      - name: Wait for services
        env:
          MAX_WAIT: "300"
        run: bash HW7/scripts/wait_for_services.sh
      - name: Warm up
        run: sleep 30
      - name: Install k6
        run: sudo apt-get update -qq && sudo apt-get install -y k6
      - name: Run k6 load test
        env:
          WMS_URL: http://localhost:8000
        run: |
          mkdir -p HW7/tests/load/results
          cd HW7
          k6 run --out json=tests/load/results/k6_raw.json --env WMS_URL=http://localhost:8000 tests/load/load_test.js
      - name: Verify health after load
        run: |
          curl -sf http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
          curl -sf http://localhost:8001/health | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', d"
      - name: Wait for Prometheus scrape
        run: sleep 30
      - name: Validate SLO
        env:
          PROMETHEUS_URL: http://localhost:9090
        run: bash HW7/scripts/check_metrics.sh
      - name: Upload load artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: HW7/tests/load/results/
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml logs --no-color > HW7/service-logs-load.txt 2>&1 || true
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-load
          path: HW7/service-logs-load.txt
      - name: Tear down
        if: always()
        run: docker compose -f HW7/docker-compose.yml -f HW7/docker-compose.ci.yml down -v